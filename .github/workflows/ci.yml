name: simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install pinned Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Run local feedback loop
        run: make check
      - name: Run unmodified upstream qualification baseline
        run: make upstream-test
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simulation-evidence
          path: |
            reports/
            build/smoke/*.fst
          retention-days: 14
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install simulation tools
        run: sudo apt-get update && sudo apt-get install -y iverilog build-essential
      - name: Install pinned development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-development.lock
      - name: Qualify the pinned stream-ring implementation
        run: make qualify
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-evidence
          path: |
            reports/development/
            build/qualification/
          retention-days: 14
