name: portable-contracts
on:
  push:
    branches: [main]
    paths:
      - 'docs/contracts/**'
      - 'config/profiles/**'
      - 'tests/models/**'
      - 'tests/test_storage_oracle.py'
      - 'requirements-portable.lock'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'docs/contracts/**'
      - 'config/profiles/**'
      - 'tests/models/**'
      - 'tests/test_storage_oracle.py'
      - 'requirements-portable.lock'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-portable.lock
      - run: python -m pytest -q tests/test_storage_oracle.py --junitxml=reports/contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contract-evidence
          path: reports/contracts.xml
          retention-days: 14
