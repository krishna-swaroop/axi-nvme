name: portable-buffer-ownership

on:
  push:
    branches: [main]
    paths:
      - "rtl/buffer/**"
      - "tests/buffer/**"
      - "scripts/sim_buffer.py"
      - ".github/workflows/buffer.yml"
      - "docs/contracts/PORTABLE_CAPTURE_V1.md"
      - "requirements-portable.lock"
  pull_request:
    paths:
      - "rtl/buffer/**"
      - "tests/buffer/**"
      - "scripts/sim_buffer.py"
      - ".github/workflows/buffer.yml"
      - "docs/contracts/PORTABLE_CAPTURE_V1.md"
      - "requirements-portable.lock"

permissions:
  contents: read

jobs:
  buffer-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install portable tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-portable.lock
      - name: Simulate ownership contract
        run: .venv/bin/python scripts/sim_buffer.py
      - name: Synthesize generic ownership structure
        if: always()
        run: |
          mkdir -p reports/buffer
          yosys -V > reports/buffer/yosys-version.txt 2>&1
          yosys -p 'read_verilog -sv rtl/buffer/buffer_ownership.sv; hierarchy -check -top buffer_ownership; proc; opt; check -assert; select -assert-none t:$dlatch t:$adlatch; stat; write_json reports/buffer/buffer_ownership.json' > reports/buffer/yosys.log 2>&1
      - name: Retain buffer qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buffer-ownership-evidence
          path: |
            reports/buffer/
            build/qualification/buffer-slots-1-tiny/
            build/qualification/buffer-slots-3-tiny/
            build/qualification/buffer-slots-8-tiny/
            build/qualification/buffer-slots-8-nominal/
          retention-days: 14
